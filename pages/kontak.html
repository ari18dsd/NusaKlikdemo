<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Kontak Kami — NusaKlik Store</title>
    <meta name="description" content="Hubungi tim NusaKlik Store melalui WhatsApp atau email resmi." />
    <link rel="icon" type="image/svg+xml" href="../assets/favicon/favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@600;700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="../style.css" />
  </head>
  <body>
    <div id="nk-header"></div>

    <main>
      <section class="page-hero">
        <div class="container">
          <nav class="breadcrumb" aria-label="Breadcrumb">
            <a href="../index.html">Beranda</a>
            <span aria-hidden="true">/</span>
            <span>Kontak</span>
          </nav>
          <h1 class="page-title">Kontak Kami</h1>
          <p class="page-lead">
            Ada pertanyaan seputar produk digital, lisensi penggunaan, atau bantuan pemesanan? Kirimkan pesan Anda langsung ke tim kami.
          </p>
        </div>
      </section>

      <section class="section">
        <div class="container">
          <div class="contact-grid">
            <div id="nk-contact-info"></div>

            <div class="info-card">
              <h3>Kirim Pesan via WhatsApp</h3>
              <p style="margin-bottom: 18px;">
                Lengkapi formulir singkat berikut untuk menyusun pesan pertanyaan otomatis ke WhatsApp admin kami.
              </p>
              <form id="nk-contact-form">
                <div class="form-group">
                  <label class="form-label" for="nk-contact-name">Nama Lengkap</label>
                  <input
                    type="text"
                    id="nk-contact-name"
                    class="form-control"
                    placeholder="Contoh: Andi Wijaya"
                    required
                  />
                </div>
                <div class="form-group">
                  <label class="form-label" for="nk-contact-topic">Topik Pertanyaan</label>
                  <select id="nk-contact-topic" class="form-control">
                    <option value="Informasi Produk">Informasi Produk</option>
                    <option value="Konfirmasi Pembayaran">Konfirmasi Pembayaran</option>
                    <option value="Bantuan Unduhan / Teknis">Bantuan Unduhan / Teknis</option>
                    <option value="Kerja Sama">Kerja Sama</option>
                  </select>
                </div>
                <div class="form-group">
                  <label class="form-label" for="nk-contact-message">Pesan</label>
                  <textarea
                    id="nk-contact-message"
                    rows="4"
                    class="form-control"
                    placeholder="Tuliskan pertanyaan atau kebutuhan Anda..."
                    required
                  ></textarea>
                </div>
                <button type="submit" class="btn btn-primary">Buat Tautan WhatsApp</button>
              </form>
              <div id="nk-contact-result"></div>
            </div>
          </div>
        </div>
      </section>
    </main>

    <div id="nk-footer"></div>
    <div id="nk-overlays"></div>

    <script src="../config.js"></script>
    <script src="../script.js"></script>
  </body>
</html>
